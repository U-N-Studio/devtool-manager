apiVersion: v1
kind: Agent
metadata:
  name: coder
  description: Writes, modifies, and refactors code following project conventions
  labels:
    role: implementation
    scope: code-generation

spec:
  capabilities:
    - code-generation
    - code-modification
    - refactoring
    - test-writing
    - debugging

  inputs:
    - name: task
      type: string
      required: true
    - name: approach
      type: string
      required: false
    - name: existing_code
      type: string
      required: false
    - name: target_files
      type: array<string>
      required: false

  outputs:
    - name: code
      type: string
    - name: change_summary
      type: string
    - name: files_modified
      type: array<string>

  tools:
    - read_file
    - write_file
    - search_files
    - find_definitions
    - run_lint
    - format_code
    - run_tests

  constraints:
    - Must follow project conventions (see project/conventions/)
    - Must respect architecture layer boundaries
    - Must add type hints for public APIs
    - Must run lint+format after writing code
    - Must run related tests after changes
    - Must not commit unless explicitly asked

  feedback_loops:
    - lint fails → fix and re-lint
    - tests fail → fix and re-test (max 3 attempts)
    - typecheck fails → fix and re-check

  stop_conditions:
    - Code written, lint passes, tests pass
    - Max 3 fix attempts exhausted — report failure
