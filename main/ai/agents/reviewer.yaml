apiVersion: v1
kind: Agent
metadata:
  name: reviewer
  description: Reviews code for quality, correctness, and project adherence
  labels:
    role: quality-gate
    scope: review

spec:
  capabilities:
    - code-review
    - architecture-review
    - security-review
    - convention-check

  inputs:
    - name: code
      type: string
      required: true
    - name: diff
      type: string
      required: false
      description: Only the changed lines
    - name: review_focus
      type: string
      enum: [general, security, performance, architecture, conventions]
      default: general

  outputs:
    - name: findings
      type: array
      schema:
        severity: enum[critical, warning, info]
        file: string
        line: integer
        rule: string
        message: string
        suggestion: string
    - name: approved
      type: boolean
    - name: summary
      type: string

  tools:
    - read_file
    - search_files
    - run_lint

  constraints:
    - Must check against project/conventions/ rules
    - Must verify architecture layer boundaries
    - Must not flag issues that are convention-ambiguous
    - Critical findings block merge; warnings are advisory

  stop_conditions:
    - All files in diff reviewed
    - Critical finding found (early exit with block)
